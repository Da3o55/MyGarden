<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyGarden 🌱</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🌱 MyGarden</h1>
        <nav>
            <button class="tab-btn active" data-tab="today">📅 Aujourd'hui</button>
            <button class="tab-btn" data-tab="list">🌿 Mes plantes</button>
            <button class="tab-btn" data-tab="add">➕ Ajouter</button>
        </nav>
    </header>

    <main>
        <!-- Onglet Aujourd'hui -->
        <section id="tab-today" class="tab-content active">
            <h2 id="today-date"></h2>

            <div class="calendar-section">
                <h3>🌸 En floraison</h3>
                <div id="blooming-list" class="plant-cards"></div>
            </div>

            <div class="calendar-section">
                <h3>✂️ À tailler</h3>
                <div id="pruning-list" class="plant-cards"></div>
            </div>

            <div class="calendar-section">
                <h3>🌾 À fertiliser</h3>
                <div id="fertilizing-list" class="plant-cards"></div>
            </div>
        </section>

        <!-- Onglet Liste -->
        <section id="tab-list" class="tab-content">
            <h2>Mes plantes</h2>
            <div id="all-plants-list" class="plant-cards"></div>
        </section>

        <!-- Onglet Ajouter -->
        <section id="tab-add" class="tab-content">
            <h2>Ajouter une plante</h2>

            <div class="external-search">
                <h3>🔍 Rechercher dans la base Perenual</h3>
                <input type="text" id="external-search-input" placeholder="Ex: Rose, Tomato, Lavender...">
                <button id="external-search-btn">Rechercher</button>
                <div id="external-results"></div>
            </div>

            <form id="plant-form">
                <input type="hidden" id="f-id">

                <label>Nom commun *</label>
                <input type="text" id="f-common_name" required>

                <label>Nom scientifique</label>
                <input type="text" id="f-scientific_name">

                <label>Exposition</label>
                <input type="text" id="f-exposure" placeholder="Plein soleil, Mi-ombre...">

                <label>Type de sol</label>
                <input type="text" id="f-soil_type" placeholder="Riche, drainé, sableux...">

                <label>Type de plante</label>
                <select id="f-plant_type">
                    <option>Fleur</option>
                    <option>Arbuste</option>
                    <option>Arbre</option>
                    <option>Fruitier</option>
                    <option>Potager</option>
                    <option>Grimpante</option>
                    <option>Plante d'intérieur</option>
                </select>

                <label>Rusticité</label>
                <input type="text" id="f-hardiness" placeholder="Zone 5-9">

                <label>Humidité du sol</label>
                <input type="text" id="f-soil_humidity" placeholder="Faible, Modérée, Élevée">

                <label>Type de feuillage</label>
                <select id="f-foliage_type">
                    <option>Caduc</option>
                    <option>Persistant</option>
                    <option>Semi-persistant</option>
                    <option>N/A</option>
                </select>

                <label>Hauteur</label>
                <input type="text" id="f-height" placeholder="1-2 m">

                <label>Floraison - Mois de début</label>
                <select id="f-bloom_start_month"></select>

                <label>Floraison - Mois de fin</label>
                <select id="f-bloom_end_month"></select>

                <label>Maladies connues</label>
                <textarea id="f-known_diseases"></textarea>

                <label>Taille - Mois de début</label>
                <select id="f-pruning_start_month"></select>

                <label>Taille - Mois de fin</label>
                <select id="f-pruning_end_month"></select>

                <label>Taille - Conseils</label>
                <textarea id="f-pruning_advice"></textarea>

                <label>Engrais - Mois de début</label>
                <select id="f-fertilize_start_month"></select>

                <label>Engrais - Mois de fin</label>
                <select id="f-fertilize_end_month"></select>

                <label>Engrais - Quantité</label>
                <input type="text" id="f-fertilize_quantity">

                <label>Engrais - Type</label>
                <input type="text" id="f-fertilize_type">

                <label>URL image</label>
                <input type="text" id="f-image_url">

                <label>Notes</label>
                <textarea id="f-notes"></textarea>

                <button type="submit">💾 Enregistrer</button>
                <button type="button" id="cancel-edit" style="display:none;">Annuler</button>
            </form>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
