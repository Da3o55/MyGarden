<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>MyGarden</title><style>:root{color-scheme:dark}body{margin:0;background:#13251d;color:#f2f0d8;font:16px Georgia,serif}main{max-width:960px;margin:auto;padding:48px 24px}h1{font-size:48px;color:#d5e87f}section{background:#1d362a;border:1px solid #54755a;border-radius:18px;padding:22px;margin:18px 0}button{background:#d5e87f;border:0;padding:10px 16px;border-radius:20px;font-weight:bold;cursor:pointer}li{padding:10px 0;border-bottom:1px solid #3b5b43}</style></head><body><main><h1>MyGarden <small>✦</small></h1><p>Votre carnet de jardin, dans Home Assistant.</p><section><h2>Tâches du jour</h2><ul id="tasks"><li>Chargement…</li></ul></section><section><h2>Plantes</h2><ul id="plants"></ul></section><script>async function load(){let [p,t]=await Promise.all([fetch('/api/plants').then(r=>r.json()),fetch('/api/tasks/today').then(r=>r.json())]);document.querySelector('#plants').innerHTML=p.map(x=>`<li><b>${x.common_name}</b> — ${x.location||'emplacement non défini'}<br><small>${x.scientific_name||''}</small></li>`).join('')||'<li>Aucune plante.</li>';document.querySelector('#tasks').innerHTML=t.map(x=>`<li>${x.kind} · ${x.common_name} <button onclick="done(${x.id})">Terminer</button></li>`).join('')||'<li>Rien à faire aujourd’hui 🎉</li>'}async function done(id){await fetch('/api/tasks/'+id+'/complete',{method:'POST'});load()}load()</script></main></body></html>
